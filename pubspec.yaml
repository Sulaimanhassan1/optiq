name: optiq
description: Offline document scanning and intelligence from Edgecraft Labs
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  flutter_secure_storage: ^11.2.0
  image: ^4.5.4
  material_ui: ^1.1.0
  sqflite: ^2.4.6
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^1.0.3
  path_provider: ^2.1.5
  pdf: ^3.11.3
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  config:
    enable-swift-package-manager: true
  uses-material-design: true
